<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Conversation Spiderweb</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1 id="sessionTitle">Conversation Spiderweb</h1>
    <button id="recordBtn" type="button">● Record</button>
  </header>

  <main>
    <svg id="graph" viewBox="0 0 420 380" preserveAspectRatio="xMidYMid meet"></svg>
  </main>

  <footer id="talkTimeBar" aria-label="Talk time by speaker"></footer>

  <!-- Local, bundled — Chrome MV3 blocks remote script execution in extension pages -->
  <script src="../lib/d3.min.js"></script>
  <script src="model.js"></script>
  <script src="popup.js"></script>
</body>
</html>
